                <div class="card-body p-4">

                    <form id="idFormArreglo" class="row g-3 align-items-end">
                        <div class="col-sm-8 col-md-5">
                            <label class="form-label" for="inputNumero">Ingresa un número</label>
                            <input id="inputNumero" class="form-control" type="number" step="any" required>

                        <div class="col-sm-4 d-flex flex-wrap gap-2">
                            <button class="btn btn-success" id="idBtnAgregar" type="submit">Agregar</button>
                            <button class="btn btn-primary" id="idBtnOrdenar" type="button">Ordenar</button>
                        </div>
                    </form>
                    <div class="mt-4">
                        <h2 class="h5">Valores ingresados</h2>
                        <div id="idContainerArreglo" class="result-area" aria-live="polite">Todavía no hay valores.</div>
                    </div>
                    <div class="mt-4">
                        <h2 class="h5">Arreglo ordenado</h2>
