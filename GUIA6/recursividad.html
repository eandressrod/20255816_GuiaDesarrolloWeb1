    <main class="app-shell d-flex flex-column flex-md-row">
        <aside class="nav-bar p-3 text-bg-dark">
            <a class="d-flex align-items-center mb-3 text-white text-decoration-none" href="indexFunciones.html">

        <div class="colum-container">
            <section class="lesson-card card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h2">Calculando el factorial</h1>
                    <p>Ingresa un número entero entre 0 y 170.</p>
                    <form id="idFormFactorial" class="row g-3 align-items-end">
                        <div class="col-sm-8 col-md-5">
                            <label class="form-label" for="idTxtNumero">Número</label>
                            <input id="idTxtNumero" class="form-control" type="text" inputmode="numeric" autocomplete="off" aria-describedby="ayudaFactorial">
                            <div id="ayudaFactorial" class="form-text">Solo se permiten números enteros.</div>
                        </div>
                        <div class="col-sm-4">
                            <button id="idBtnCalcular" class="btn btn-primary" type="submit">Calcular</button>
                        </div>
                    </form>
                    <p id="idDivResultado" class="function-result fs-4 fw-bold mt-4 mb-0" role="status" aria-live="polite"></p>
                </div>
            </section>
            <footer class="lesson-card site-footer small"><a href="../index.html#guia-6">Volver al índice principal</a></footer>
        </div>
