<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos de cafetería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="js/pedidos.js" defer></script>
</head>
<body class="bg-light">
    <main class="container py-4">
        <h1 class="mb-4">Pedidos de cafetería</h1>

        <form id="formPedido" class="border bg-white rounded p-3 mb-4" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="producto" class="form-label">Producto</label>
                    <input type="text" id="producto" name="producto" class="form-control" required>
                </div>
                <div class="col-sm-6 col-md-3">
                    <label for="precio" class="form-label">Precio unitario ($)</label>
                    <input type="number" id="precio" name="precio" class="form-control" min="0.01" step="any" required>
                </div>
                <div class="col-sm-6 col-md-3">
                    <label for="cantidad" class="form-label">Cantidad</label>
                    <input type="number" id="cantidad" name="cantidad" class="form-control" min="1" step="1" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Agregar pedido</button>
        </form>

        <div class="row g-2 align-items-end mb-3">
            <div class="col-sm-4">
                <label for="precioMaximo" class="form-label">Precio máximo ($)</label>
                <input type="number" id="precioMaximo" class="form-control" min="0" step="any">
            </div>
            <div class="col-sm-auto d-flex flex-wrap gap-2">
                <button type="button" id="btnFiltrar" class="btn btn-secondary">Filtrar productos</button>
                <button type="button" id="btnMostrar" class="btn btn-outline-secondary">Mostrar todos</button>
                <button type="button" id="btnLimpiar" class="btn btn-outline-danger">Limpiar pedidos</button>
            </div>
        </div>

        <p id="mensaje" class="text-danger" role="alert" hidden></p>

        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">Producto</th>
                        <th scope="col">Precio unitario</th>
                        <th scope="col">Cantidad</th>
                        <th scope="col">Subtotal</th>
                    </tr>
                </thead>
                <tbody id="tablaPedidos"></tbody>
            </table>
        </div>

        <div class="d-flex flex-wrap gap-4 mb-4" aria-live="polite">
            <p class="mb-0">Unidades totales: <strong id="totalUnidades">0</strong></p>
            <p class="mb-0">Monto total: <strong id="montoTotal">$0.00</strong></p>
        </div>

        <a href="index.html" class="btn btn-primary">Regresar</a>
    </main>
</body>
</html>
